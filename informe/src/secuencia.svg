<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#002259"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7c86"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <rect width="1200" height="6" fill="#FFC600"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#002259">Flujo de publicación y recepción de un producto</text>
  <text x="40" y="70" font-size="13.5" fill="#5b6b7d">Diagrama de secuencia · el productor publica de forma atómica; el portal consulta el manifiesto cada 60 s y valida cada archivo</text>

  <!-- participantes -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="70" y="92" width="220" height="44" rx="8" fill="#e6eefb" stroke="#0047BA"/><text x="180" y="120" fill="#0047BA">Sistema productor</text>
    <rect x="370" y="92" width="220" height="44" rx="8" fill="#f7f9fc" stroke="#9fb3c8"/><text x="480" y="120" fill="#002259">Repositorio (servidor web)</text>
    <rect x="670" y="92" width="220" height="44" rx="8" fill="#002259"/><text x="780" y="120" fill="#fff">Portal (navegador)</text>
    <rect x="950" y="92" width="200" height="44" rx="8" fill="#fff" stroke="#002259" stroke-dasharray="5 4"/><text x="1050" y="120" fill="#002259">Copia local</text>
  </g>
  <g stroke="#9fb3c8" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="180" y1="136" x2="180" y2="730"/><line x1="480" y1="136" x2="480" y2="730"/><line x1="780" y1="136" x2="780" y2="730"/><line x1="1050" y1="136" x2="1050" y2="730"/>
  </g>

  <g font-size="13" fill="#14212f">
    <!-- productor -->
    <rect x="40" y="150" width="280" height="190" rx="10" fill="#e6eefb" fill-opacity=".45"/>
    <text x="52" y="168" font-size="11" font-weight="700" fill="#0047BA" letter-spacing="1">EN CADA EMISIÓN (CADA 10 MIN EN MONITOREO)</text>
    <path d="M180 186 h40 v22 h-36" stroke="#002259" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="228" y="201">1. Genera el JSON</text>
    <path d="M180 226 h40 v22 h-36" stroke="#002259" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="228" y="241">2. Valida con el contrato</text>
    <line x1="182" y1="276" x2="474" y2="276" stroke="#002259" stroke-width="2" marker-end="url(#a)"/><text x="196" y="270">3. Sube archivo .tmp y lo renombra (atómico)</text>
    <line x1="182" y1="318" x2="474" y2="318" stroke="#002259" stroke-width="2" marker-end="url(#a)"/><text x="196" y="312">4. Actualiza manifest.json AL FINAL</text>

    <!-- apertura -->
    <rect x="640" y="356" width="530" height="56" rx="10" fill="#f3f6fa"/>
    <text x="652" y="374" font-size="11" font-weight="700" fill="#5b6b7d" letter-spacing="1">AL ABRIR EL PORTAL</text>
    <line x1="782" y1="396" x2="1044" y2="396" stroke="#0e7c86" stroke-width="2" marker-end="url(#g)"/><text x="800" y="390">5. Muestra la última versión válida al instante</text>

    <!-- ciclo -->
    <rect x="340" y="428" width="830" height="290" rx="10" fill="#fff8db" stroke="#e6c34d"/>
    <text x="352" y="446" font-size="11" font-weight="700" fill="#5c4400" letter-spacing="1">CICLO: CADA 60 S, AL VOLVER A LA PESTAÑA O AL RECUPERAR LA RED</text>
    <line x1="778" y1="474" x2="486" y2="474" stroke="#002259" stroke-width="2" marker-end="url(#a)"/><text x="500" y="468">6. GET manifest.json (&lt; 1 KB)</text>
    <line x1="778" y1="514" x2="486" y2="514" stroke="#002259" stroke-width="2" marker-end="url(#a)"/><text x="500" y="508">7. Si cambió «emitido»: GET producto.json?v=…</text>
    <path d="M780 532 h40 v22 h-36" stroke="#002259" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="828" y="547">8. Valida contra el contrato 1.0</text>

    <rect x="700" y="566" width="460" height="68" rx="8" fill="#e8f5ec" stroke="#22834a"/>
    <text x="712" y="584" font-size="11" font-weight="700" fill="#22834a">SI ES VÁLIDO</text>
    <line x1="782" y1="614" x2="1044" y2="614" stroke="#0e7c86" stroke-width="2" marker-end="url(#g)"/><text x="796" y="608">9a. Guarda como última válida y redibuja</text>

    <rect x="700" y="642" width="460" height="64" rx="8" fill="#fdecea" stroke="#d93a2b"/>
    <text x="712" y="660" font-size="11" font-weight="700" fill="#d93a2b">SI ES INVÁLIDO O NO LLEGÓ</text>
    <text x="712" y="684">9b. Lo rechaza, conserva la versión anterior</text>
    <text x="712" y="700">y lo marca en la tarjeta y en «Estado del servicio»</text>
  </g>
</svg>
