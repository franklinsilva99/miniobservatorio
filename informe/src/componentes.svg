<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b7d"/></marker></defs>
  <rect width="1200" height="640" fill="#fff"/>
  <rect width="1200" height="6" fill="#FFC600"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#002259">Componentes del frontend</text>
  <text x="40" y="70" font-size="13.5" fill="#5b6b7d">Módulos JavaScript estándar organizados en capas · sin frameworks ni compilación · ~150 KB en total</text>

  <!-- capa presentacion -->
  <rect x="40" y="92" width="820" height="150" rx="12" fill="#e6eefb" stroke="#0047BA"/>
  <text x="60" y="118" font-size="12" font-weight="700" fill="#0047BA" letter-spacing="1">CAPA DE PRESENTACIÓN · js/ui/</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="132" width="148" height="92" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="134" y="164" font-weight="700" fill="#002259">mosaico.js</text><text x="134" y="186" fill="#5b6b7d">8 tarjetas</text><text x="134" y="204" fill="#5b6b7d">+ mapa con capas</text>
    <rect x="220" y="132" width="148" height="92" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="294" y="164" font-weight="700" fill="#002259">detalle.js</text><text x="294" y="186" fill="#5b6b7d">6 vistas</text><text x="294" y="204" fill="#5b6b7d">ampliadas</text>
    <rect x="380" y="132" width="148" height="92" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="454" y="164" font-weight="700" fill="#002259">graficos.js</text><text x="454" y="186" fill="#5b6b7d">mapa SVG, series,</text><text x="454" y="204" fill="#5b6b7d">indicador de nivel</text>
    <rect x="540" y="132" width="148" height="92" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="614" y="164" font-weight="700" fill="#002259">estado.js</text><text x="614" y="186" fill="#5b6b7d">selecciones y</text><text x="614" y="204" fill="#5b6b7d">catálogo</text>
    <rect x="700" y="132" width="148" height="92" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="774" y="164" font-weight="700" fill="#002259">util.js</text><text x="774" y="186" fill="#5b6b7d">formato SI, hora</text><text x="774" y="204" fill="#5b6b7d">de Lima, iconos</text>
  </g>

  <!-- capa datos -->
  <rect x="40" y="276" width="820" height="150" rx="12" fill="#e3f4f5" stroke="#0e7c86"/>
  <text x="60" y="302" font-size="12" font-weight="700" fill="#0e7c86" letter-spacing="1">CAPA DE DATOS · js/datos/</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="316" width="240" height="92" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="180" y="348" font-weight="700" fill="#002259">repositorio.js</text><text x="180" y="370" fill="#5b6b7d">manifiesto, descarga, rechazo,</text><text x="180" y="388" fill="#5b6b7d">copia local y salud</text>
    <rect x="320" y="316" width="240" height="92" rx="8" fill="#FFC600" fill-opacity=".22" stroke="#c99a00"/><text x="440" y="348" font-weight="700" fill="#002259">contrato.js</text><text x="440" y="370" fill="#5b6b7d">esquemas y validación</text><text x="440" y="388" fill="#5c4400" font-weight="600">compartido con tools/</text>
    <rect x="580" y="316" width="268" height="92" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="714" y="348" font-weight="700" fill="#002259">modelo.js</text><text x="714" y="370" fill="#5b6b7d">contrato → modelo de vista</text><text x="714" y="388" fill="#5b6b7d">(escapa textos, calcula estados)</text>
  </g>

  <!-- capa navegador -->
  <rect x="40" y="460" width="820" height="140" rx="12" fill="#f3f6fa" stroke="#9fb3c8"/>
  <text x="60" y="486" font-size="12" font-weight="700" fill="#5b6b7d" letter-spacing="1">SERVICIOS DEL NAVEGADOR (ESTÁNDAR, SIN LIBRERÍAS)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="500" width="180" height="80" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="150" y="534" font-weight="700" fill="#002259">Fetch API</text><text x="150" y="556" fill="#5b6b7d">descarga de productos</text>
    <rect x="260" y="500" width="180" height="80" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="350" y="534" font-weight="700" fill="#002259">localStorage</text><text x="350" y="556" fill="#5b6b7d">última versión válida</text>
    <rect x="460" y="500" width="180" height="80" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="550" y="534" font-weight="700" fill="#002259">Service Worker</text><text x="550" y="556" fill="#5b6b7d">app sin conexión (sw.js)</text>
    <rect x="660" y="500" width="188" height="80" rx="8" fill="#fff" stroke="#9fb3c8"/><text x="754" y="534" font-weight="700" fill="#002259">Intl · SVG</text><text x="754" y="556" fill="#5b6b7d">fechas, mapas, gráficos</text>
  </g>

  <!-- laterales -->
  <g font-size="13" text-anchor="middle">
    <rect x="900" y="92" width="260" height="110" rx="12" fill="#002259"/><text x="1030" y="128" font-weight="700" fill="#fff" font-size="15">app.js · index.html</text><text x="1030" y="152" fill="#c9d7ee">arranque, eventos, rutas,</text><text x="1030" y="172" fill="#c9d7ee">ciclo de 60 s, reloj</text>
    <rect x="900" y="222" width="260" height="80" rx="12" fill="#fff" stroke="#002259"/><text x="1030" y="254" font-weight="700" fill="#002259">config.js</text><text x="1030" y="276" fill="#5b6b7d">URL repositorio, intervalo</text>
    <rect x="900" y="322" width="260" height="80" rx="12" fill="#fff" stroke="#002259"/><text x="1030" y="354" font-weight="700" fill="#002259">geo/peru.js</text><text x="1030" y="376" fill="#5b6b7d">cartografía base INEI</text>
    <rect x="900" y="440" width="260" height="160" rx="12" fill="#fff8db" stroke="#e6c34d"/><text x="1030" y="472" font-weight="700" fill="#5c4400" font-size="14">tools/ (Node, no se despliega)</text>
    <text x="1030" y="498" fill="#14212f">publicar.mjs · validar.mjs</text><text x="1030" y="520" fill="#14212f">lib-publicacion.mjs</text><text x="1030" y="542" fill="#14212f">generar-ejemplos.mjs</text><text x="1030" y="564" fill="#14212f">servidor.mjs</text><text x="1030" y="586" fill="#5b6b7d">usan el mismo contrato.js</text>
  </g>
  <g stroke="#5b6b7d" stroke-width="2" fill="none">
    <line x1="450" y1="242" x2="450" y2="272" marker-end="url(#a)"/>
    <line x1="450" y1="426" x2="450" y2="456" marker-end="url(#a)"/>
    <line x1="896" y1="150" x2="864" y2="150" marker-end="url(#a)"/>
    <path d="M900 470 H878 V443 H520 V412" stroke-dasharray="5 4" marker-end="url(#a)"/>
  </g>
</svg>
