<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b7d"/></marker></defs>
  <rect width="1200" height="600" fill="#fff"/>
  <rect width="1200" height="6" fill="#FFC600"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#002259">Estados de un producto en el portal</text>
  <text x="40" y="70" font-size="13.5" fill="#5b6b7d">Cada uno de los 6 productos tiene su propio estado: si uno falla, los demás siguen funcionando</text>

  <g font-size="13" text-anchor="middle">
    <circle cx="70" cy="300" r="12" fill="#002259"/><text x="70" y="335" font-size="12" fill="#5b6b7d">Abre el</text><text x="70" y="351" font-size="12" fill="#5b6b7d">portal</text>
    <rect x="140" y="250" width="200" height="100" rx="14" fill="#eef1f5" stroke="#6b7785" stroke-width="2"/>
    <text x="240" y="290" font-size="15" font-weight="700" fill="#14212f">Verificando</text>
    <text x="240" y="312" fill="#5b6b7d">Muestra la copia local</text><text x="240" y="330" fill="#5b6b7d">mientras consulta</text>

    <rect x="490" y="120" width="210" height="360" rx="14" fill="#e8f5ec" stroke="#22834a" stroke-width="2.5"/>
    <text x="595" y="284" font-size="18" font-weight="700" fill="#22834a">Al día</text>
    <text x="595" y="308" fill="#14212f">Llegó la emisión</text><text x="595" y="326" fill="#14212f">esperada y es válida</text>

    <rect x="140" y="470" width="200" height="100" rx="14" fill="#eef1f5" stroke="#6b7785" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="240" y="512" font-size="15" font-weight="700" fill="#14212f">No disponible</text>
    <text x="240" y="534" fill="#5b6b7d">Nunca llegó una</text><text x="240" y="552" fill="#5b6b7d">versión válida</text>

    <rect x="900" y="110" width="260" height="90" rx="14" fill="#fff1e3" stroke="#f08c1a" stroke-width="2"/>
    <text x="1030" y="146" font-size="15" font-weight="700" fill="#b35f00">Desactualizado</text>
    <text x="1030" y="168" fill="#14212f">Antigüedad &gt; 2 × frecuencia</text><text x="1030" y="186" fill="#5b6b7d">se sigue mostrando</text>

    <rect x="900" y="255" width="260" height="90" rx="14" fill="#fff1e3" stroke="#f08c1a" stroke-width="2"/>
    <text x="1030" y="291" font-size="15" font-weight="700" fill="#b35f00">Sin conexión</text>
    <text x="1030" y="313" fill="#14212f">El repositorio no responde</text><text x="1030" y="331" fill="#5b6b7d">última versión recibida</text>

    <rect x="900" y="400" width="260" height="90" rx="14" fill="#fdecea" stroke="#d93a2b" stroke-width="2"/>
    <text x="1030" y="436" font-size="15" font-weight="700" fill="#d93a2b">Rechazado</text>
    <text x="1030" y="458" fill="#14212f">El archivo no cumple el contrato</text><text x="1030" y="476" fill="#5b6b7d">se conserva la versión anterior</text>
  </g>

  <g stroke="#5b6b7d" stroke-width="2" fill="none">
    <line x1="82" y1="300" x2="136" y2="300" marker-end="url(#a)"/>
    <line x1="340" y1="300" x2="486" y2="300" marker-end="url(#a)"/>
    <line x1="240" y1="350" x2="240" y2="466" marker-end="url(#a)"/>
    <path d="M340 520 H595 V484" marker-end="url(#a)"/>
    <line x1="700" y1="143" x2="896" y2="143" marker-end="url(#a)"/>
    <line x1="900" y1="167" x2="704" y2="167" marker-end="url(#a)"/>
    <line x1="700" y1="288" x2="896" y2="288" marker-end="url(#a)"/>
    <line x1="900" y1="312" x2="704" y2="312" marker-end="url(#a)"/>
    <line x1="700" y1="433" x2="896" y2="433" marker-end="url(#a)"/>
    <line x1="900" y1="457" x2="704" y2="457" marker-end="url(#a)"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="413" y="292" fill="#14212f">versión vigente</text>
    <text x="250" y="414" fill="#14212f" text-anchor="start">falla y no hay copia</text>
    <text x="468" y="540" fill="#14212f">llega la primera versión válida</text>
    <text x="798" y="135" fill="#14212f">no llega emisión</text>
    <text x="798" y="185" fill="#22834a">llega emisión</text>
    <text x="798" y="280" fill="#14212f">red caída</text>
    <text x="798" y="330" fill="#22834a">vuelve la red</text>
    <text x="798" y="425" fill="#14212f">archivo inválido</text>
    <text x="798" y="475" fill="#22834a">archivo válido</text>
  </g>
</svg>
