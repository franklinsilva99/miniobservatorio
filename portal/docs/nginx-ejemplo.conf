# Ejemplo de Nginx para el Portal de Contingencia. Se sirven solo archivos estáticos: el público
# nunca llega al backend ni a la base de datos. Ajustar server_name, root y certificados al desplegar.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión: reduce mucho lo que se envía, que es el límite real con mucho tráfico.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    # Usa el archivo .gz si existe, para no gastar CPU comprimiendo en cada pedido.
    gzip_static on;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Solo lectura.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Manifiestos: siempre se revalidan; si no cambiaron, responde 304, casi sin datos.
    location ~ manifest\.json$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Productos y detalles: el portal los pide con ?v=<emitido>, que cambia con cada emisión.
    location /productos/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
